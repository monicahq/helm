repos:
  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs

  - repo: https://github.com/losisin/helm-values-schema-json
    rev: v2.5.0
    hooks:
      - id: helm-schema
        args: ["--values", "charts/monica/values.yaml", "--output", "charts/monica/values.schema.json", "--indent", "2"]
