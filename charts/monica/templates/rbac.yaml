{{- if .Values.rbac.create }}
{{- $fullName := include "monica.fullname" . -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-privileged
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - extensions
    resourceNames:
      - privileged
    resources:
      - podsecuritypolicies
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-privileged
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-privileged
subjects:
  - kind: ServiceAccount
    name: {{ include "monica.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
